name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: Cemu-UWP

      # T98 wheel bridge: compile and run the platform-independent logic first.
      # These are simulated tests only; they involve no wheel, console or game.
      - name: Simulated wheel-bridge tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (echo Visual Studio C++ tools were not found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++14 /EHsc /W4 /utf-8 /Fe:t98_tests.exe /Fo:t98_tests.obj Cemu-UWP\tests\t98_bridge_tests.cpp || exit /b 1
          t98_tests.exe || exit /b 1

      - name: Checkout Cemu
        uses: actions/checkout@v7
        with:
          repository: XboxEmuPorts/Cemu
          ref: build-msvc-d3d11
          path: Cemu
          submodules: recursive

      - name: Checkout SDL3 UWP
        uses: actions/checkout@v7
        with:
          repository: XboxEmuPorts/SDL3-UWP
          path: SDL3-uwp

      - name: Get Cemu cache key
        id: cemu-key
        shell: pwsh
        run: '"key=$(git -C Cemu rev-parse HEAD)-$(git -C SDL3-uwp rev-parse HEAD)" >> $env:GITHUB_OUTPUT'

      - name: Cache Cemu
        id: cache-cemu
        uses: actions/cache@v6
        with:
          path: Cemu/bin
          key: cemu-bin-${{ steps.cemu-key.outputs.key }}

      - name: Cache vcpkg
        if: steps.cache-cemu.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ hashFiles('Cemu/cmake/vcpkg-embed/vcpkg.json', 'Cemu/dependencies/vcpkg_overlay_ports*/**') }}
          restore-keys: |
            vcpkg-

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'

      - name: Bootstrap vcpkg
        if: steps.cache-cemu.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\Cemu\dependencies\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Build Cemu
        if: steps.cache-cemu.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S .\Cemu -B .\Cemu\build `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCEMU_UWP=ON `
            -DENABLE_D3D11=ON `
            -DENABLE_D3D12=ON
          cmake --build .\Cemu\build --config Release --target CemuBin --parallel

      - name: Set package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Tag must be a numeric version such as v1.0.11 or v1.0.11.0"
          }
          if (($version -split '\.').Count -eq 3) { $version += '.0' }
          [xml]$manifest = Get-Content '.\Cemu-UWP\Package.appxmanifest' -Raw
          $manifest.Package.Identity.Version = $version
          $manifest.Save((Resolve-Path '.\Cemu-UWP\Package.appxmanifest').Path)

      - name: Build package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'dist\'
          msbuild .\Cemu-UWP\Cemu-UWP-Host.vcxproj `
            /restore /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:AppxPackageDir=$packageDir" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:GenerateAppxPackageOnBuild=true `
            /p:GenerateAppInstallerFile=false `
            "/flp:logfile=$env:GITHUB_WORKSPACE\msbuild-host.log;verbosity=normal;encoding=UTF-8"

      - name: Upload host build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-build-log
          path: msbuild-host.log
          if-no-files-found: ignore

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null

          $bundle = Get-ChildItem .\dist -Recurse -File |
            Where-Object { $_.Extension -in '.appxbundle', '.msixbundle' } |
            Select-Object -First 1
          if (-not $bundle) { throw 'No app bundle was produced.' }

          $vclibs = Get-ChildItem .\dist -Recurse -File -Filter 'Microsoft.VCLibs.x64.14.00.appx' |
            Select-Object -First 1
          if (-not $vclibs) { throw 'Microsoft.VCLibs.x64.14.00.appx was not produced.' }

          Copy-Item $bundle.FullName .\release\
          Copy-Item $vclibs.FullName .\release\

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Cemu-UWP
          path: release/*
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
